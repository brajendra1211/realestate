name: bayaestate_app
description: "BayaEstate — real estate marketplace and agent platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Networking + cookie-based auth
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.5

  # Images + files
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  # Location (agent dispatch, direct-visit GPS tagging)
  geolocator: ^13.0.2

  # Fonts
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
